name: Node.js Tests

on:
  push:
    branches: ["**"]

jobs:
  test:
    if: contains(github.event.head_commit.message, '[test]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    # Spin up a real Redis so redis.test.js can connect
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    defaults:
      run:
        working-directory: backend/src/Nodejs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/src/Nodejs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        id: run_tests
        run: npm test
        env:
          NODE_ENV: test
          FHIR_SERVER_URL: http://localhost:8080/fhir
          REDIS_URL: redis://localhost:6379
          REDIS_URL_PATIENTS: redis://localhost:6379
          REDIS_AUDIT_URL: redis://localhost:6379
          REDIS_HANDSHAKES_URL: redis://localhost:6379
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: testuser
          DB_PASSWORD: testpass
          DB_NAME: test_db
          DB_SSL: false
          SESSION_SECRET: test-secret-ci
          PORT: 3000
          NODE_TLS_REJECT_UNAUTHORIZED: 0

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "test-results-${{ github.sha }}"
          path: |
            backend/src/Nodejs/test-results/junit.xml
            backend/src/Nodejs/test-results/report.html
          retention-days: 14

      - name: Comment on commit (success)
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const artifactUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `✅ **Node.js tests passed!**\n\n📦 [View test results & artifacts](${artifactUrl})`
            });

      - name: Comment on commit (failure)
        if: failure() && steps.run_tests.conclusion == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const artifactUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `❌ **Node.js tests failed!**\n\n🔍 [View logs & test results](${artifactUrl})\n\nPlease fix the failing tests before merging.`
            });
