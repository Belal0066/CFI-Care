workflows:
  flutter-monorepo-workflow:
    name: Flutter App Build
    max_build_duration: 120
    instance_type: mac_mini_m1
    
    # 1. Point Codemagic directly to your Flutter project
    working_directory: mobile/src
    
    triggering:
      events:
        - push
        - pull_request
      cancel_previous_builds: true
      # 2. Only trigger builds when files inside mobile/src change
      when:
        changeset:
          includes:
            - 'mobile/src/**'
            
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build Android App Bundle
        script: flutter build appbundle --release
        
    artifacts:
      # These paths are automatically relative to your working_directory (mobile/src)
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/*.apk