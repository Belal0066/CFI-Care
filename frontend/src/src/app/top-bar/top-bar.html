<div class="top-bar">
  <div class="left-section">
    <span class="brand-name">CFI-Care</span>
    <span class="divider">|</span>
    <span class="page-title">Patients Dashboard</span>
  </div>

  <div class="right-section">
    <div class="user-section">
      <div class="dropdown">
        <button class="account-btn dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
          Account
        </button>
        <ul class="dropdown-menu dropdown-menu-end doctor-menu">
          <li>
            <a class="dropdown-item" routerLink="/doctor-profile">
              <i class="bi bi-person-badge me-2"></i> Doctor Profile
            </a>
          </li>
          <!-- <button type="button" class="btn btn-outline-light btn-sm dropdown-toggle" data-bs-toggle="dropdown"
            aria-expanded="false">
            <i class="bi bi-gear-wide-connected"></i>
            <span class="logout-text">Settings</span>
          </button> -->
          <!-- <ul class="dropdown-menu dropdown-menu-end"> -->
            <li>
              <button class="dropdown-item" type="button" (click)="openPasswordChange()">
                <i class="bi bi-key me-2"></i>
                Change Password
              </button>
            </li>
            <li>
              <button class="dropdown-item" type="button" (click)="openTOTP()">
                <i class="bi bi-shield-lock me-2"></i>
                Configure 2FA (TOTP)
              </button>
            </li>
            <li>
              <hr class="dropdown-divider">
            </li>
            <li>
              <button class="dropdown-item" type="button" (click)="logout()">
                <i class="bi bi-box-arrow-right me-2"></i> Logout (This Device)
              </button>
            </li>
            <li>
              <button class="dropdown-item text-danger" type="button" (click)="logoutAll()">
                <i class="bi bi-power me-2"></i> Logout All Devices
              </button>
            </li>
          </ul>
      </div>
    </div>
  </div>
</div>
