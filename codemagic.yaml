workflows:
  flutter-monorepo-workflow:
    name: Flutter App Build
    max_build_duration: 120
    instance_type: mac_mini_m1
    
    working_directory: mobile/src
    
    # 1. Import the environment variable group you created
    environment:
      groups:
        - gitcrypt_vars
    
    triggering:
      events:
        - push
        - pull_request
      cancel_previous_builds: true
      
    when:
      changeset:
        includes:
          - 'mobile/src/**'
            
    # FIXED: Indented 'scripts' to align with 'when', 'triggering', etc.
    scripts:
      - name: Unlock git-crypt
        script: |
          set -e
          
          # Install git-crypt on the macOS build machine
          brew install git-crypt
          
          # Decode the base64 environment variable back into a binary key file
          echo $GIT_CRYPT_KEY | base64 --decode > /tmp/git-crypt-key.key
          
          # Navigate to the correct root of the repository to unlock it
          cd $CM_BUILD_DIR
          git-crypt unlock /tmp/git-crypt-key.key
          
      - name: Get Flutter packages
        script: flutter pub get
        
      - name: Build Android App Bundle
        script: flutter build appbundle --release
        
      - name: Build iOS IPA
        script: flutter build ipa --release        
        
    # FIXED: Indented 'artifacts' properly and removed the .apk path
    artifacts:
      - build/**/outputs/**/*.aab
      - build/ios/ipa/*.ipa