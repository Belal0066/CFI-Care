<div class="card mb-3" style="width: 43%; height: 90px;">
    <div class="card-body  d-flex align-items-center p-2">
        <div class="card-icon">
            <i [class]="icon"></i>
        </div>

        <div class="text-block ms-3">
            <h5 class="card-title mb-1" style="color: white;">{{ title }}</h5>
            <p class="card-text mb-0" style="color: white;">{{ description }}</p>
        </div>
    </div>
</div>
