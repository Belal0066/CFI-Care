<div class="top-bar d-flex align-items-center justify-content-between px-3">
  <!-- Left: Logo + Title -->
  <div class="d-flex align-items-center gap-3">
    <span class="logo-text">MedFlow</span>
    <span class="divider">|</span>
    <span class="page-title">Patients Dashboard</span>
  </div>

  <!-- Right: Doctor Avatar Dropdown -->
  <div class="dropdown">
    <button
      class="avatar-btn dropdown-toggle"
      type="button"
      data-bs-toggle="dropdown"
      aria-expanded="false"
    >
      <i class="bi bi-person-circle"></i>
    </button>
    <ul class="dropdown-menu dropdown-menu-end doctor-menu">
      <li>
        <a class="dropdown-item" href="/doctor-profile">
          <i class="bi bi-person me-2"></i> My Doctor Profile
        </a>
      </li>
      <!-- <li>
        <a class="dropdown-item" href="/settings">
          <i class="bi bi-gear me-2"></i> Account Settings
        </a>
      </li> -->
      <li><hr class="dropdown-divider" /></li>
      <li>
        <button class="dropdown-item text-danger" type="button" (click)="logout()">
          <i class="bi bi-box-arrow-right me-2"></i> Logout
        </button>
      </li>
    </ul>
  </div>
</div>
