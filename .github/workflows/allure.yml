name: Allure Tests

on:
  push:
    paths:
      - "tests/**"
      - "backend/tests/**"
      - "ai/**"
      - ".github/workflows/allure.yml"
  pull_request:
    paths:
      - "tests/**"
      - "backend/tests/**"
      - "ai/**"
      - ".github/workflows/allure.yml"

jobs:
  allure:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            tests/package-lock.json
            backend/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r integration/requirements.txt
          pip install -r ../ai/requirements.txt

      - name: Install Node dependencies (Allure CLI)
        run: npm ci

      - name: Install Node dependencies (backend tests)
        run: npm ci
        working-directory: backend

      - name: Download history from previous run
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREV_RUN=$(gh run list \
            --repo ${{ github.repository }} \
            --workflow allure.yml \
            --branch ${{ github.ref_name }} \
            --status success \
            --json databaseId \
            --jq '.[0].databaseId' \
            --limit 1 2>/dev/null || echo "")
          if [ -n "$PREV_RUN" ] && [ "$PREV_RUN" != "${{ github.run_id }}" ]; then
            echo "Downloading history from run $PREV_RUN"
            gh run download "$PREV_RUN" \
              --name allure-history \
              --dir /tmp/allure-history \
              --repo ${{ github.repository }} 2>/dev/null || true
            if [ -d /tmp/allure-history ]; then
              mkdir -p allure-results/history
              cp -r /tmp/allure-history/* allure-results/history/
              echo "History loaded: $(ls allure-results/history/ | wc -l) entries"
            fi
          else
            echo "No previous run found — starting fresh history"
          fi

      - name: Precompute stability (from history)
        run: npm run stability:precompute

      - name: Run all tests
        run: npm test

      - name: Analyze stability
        run: npm run stability:summary

      - name: Write environment metadata
        run: node ../tests/allure-core/environment.js

      - name: Write coverage summary
        run: node ../tests/allure-core/coverage.js

      - name: Write executor metadata
        run: node ../tests/allure-core/executor.js

      - name: Write test categories
        run: node ../tests/allure-core/categories.js

      - name: Generate Allure report
        run: npm run report

      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: |
            tests/allure-report
            tests/allure-results

      - name: Upload history data for next run
        uses: actions/upload-artifact@v4
        with:
          name: allure-history
          path: tests/allure-report/data/test-results
          retention-days: 30
          overwrite: true
