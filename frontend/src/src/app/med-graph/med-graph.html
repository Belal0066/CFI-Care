<div class="graph-page" [class.chat-open]="isChatOpen">

  <div class="graph-container">
    <iframe
      #graphFrame
      src="/assets/med-graph_legacy.html"
      class="graph-frame">
    </iframe>
  </div>

  <!-- Chat panel is always mounted; parent controls width and passes visibility -->
  <app-chat-section
    class="chat-container"
    [showChatbot]="isChatOpen"
    (close)="toggleChat()">
  </app-chat-section>

  <button
    class="fab-toggle"
    (click)="toggleChat()"
    [class.active]="isChatOpen"
    aria-label="Toggle AI Assistant"
    style="padding: 0px 2px; border-top: none; border-bottom: none; ">
    
    <span *ngIf="!isChatOpen">AI</span>
    <span *ngIf="isChatOpen"><i class="bi bi-caret-right"></i></span>
    <i class="bi bi-caret-left"></i>    
  </button>

</div>
