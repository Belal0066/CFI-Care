workflows:
  flutter-monorepo-workflow:
    name: Flutter App Build
    max_build_duration: 120
    instance_type: mac_mini_m1
    
    working_directory: mobile/src
    
    triggering:
      events:
        - push
        - pull_request
      cancel_previous_builds: true
      
    when:
      changeset:
        includes:
          - 'mobile/src/**'
            
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build Android App Bundle
        script: flutter build appbundle --release
      # ADDED: Command to build the iOS IPA
      - name: Build iOS IPA
        script: flutter build ipa --release
        
    artifacts:
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/*.apk
      # ADDED: Path to save the generated iOS artifact
      - build/ios/ipa/*.ipa