<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOC//PARSE → OCR TERMINAL</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Rubik:wght@500;900&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Mono', monospace;
            background: #0a0a0a;
            background-image: 
                repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,.03) 2px, rgba(255,255,255,.03) 4px);
            min-height: 100vh;
            padding: 25px;
            color: #fff;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
        }

        .header {
            margin-bottom: 40px;
            position: relative;
        }

        .header h1 {
            font-family: 'Rubik', sans-serif;
            font-size: 3.5em;
            font-weight: 900;
            margin-bottom: 5px;
            background: linear-gradient(45deg, #ffff00, #00ff00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-transform: uppercase;
            letter-spacing: -2px;
            line-height: 1;
        }

        .header p {
            font-size: 0.95em;
            color: #888;
            font-family: 'Space Mono', monospace;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 10px;
        }

        .card {
            background: #111;
            border: 4px solid #ffff00;
            padding: 0;
            margin-bottom: 25px;
            position: relative;
            box-shadow: 8px 8px 0 rgba(255,255,0,0.3);
        }

        .card::before {
            content: '■';
            position: absolute;
            top: -2px;
            right: -2px;
            color: #ff0000;
            font-size: 20px;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        .upload-section {
            padding: 35px;
        }

        .file-input-wrapper {
            position: relative;
            display: block;
            margin-bottom: 25px;
        }

        .file-input-wrapper input[type="file"] {
            position: absolute;
            left: -9999px;
        }

        .file-input-label {
            display: block;
            padding: 20px 30px;
            background: #ffff00;
            color: #000;
            border: none;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 4px solid #000;
            position: relative;
            transition: all 0.1s ease;
            font-family: 'Space Mono', monospace;
        }

        .file-input-label:hover {
            background: #00ff00;
            transform: translate(-3px, -3px);
            box-shadow: 3px 3px 0 #ffff00;
        }

        .file-input-label:active {
            transform: translate(0, 0);
            box-shadow: none;
        }

        .file-name {
            display: block;
            margin-top: 15px;
            color: #00ff00;
            font-size: 0.9em;
            background: rgba(0,255,0,0.1);
            padding: 12px;
            border: 2px dashed #00ff00;
            font-family: 'Space Mono', monospace;
        }

        .api-key-section {
            margin-bottom: 25px;
            background: #1a1a1a;
            padding: 20px;
            border-left: 6px solid #ff0000;
        }

        .api-key-section label {
            display: block;
            margin-bottom: 10px;
            color: #ff0000;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.85em;
            letter-spacing: 2px;
        }

        .api-key-section input {
            width: 100%;
            padding: 15px;
            background: #000;
            border: 3px solid #333;
            color: #00ff00;
            font-size: 1em;
            font-family: 'Space Mono', monospace;
            transition: all 0.2s;
        }

        .api-key-section input:focus {
            outline: none;
            border-color: #00ff00;
            box-shadow: 0 0 0 2px rgba(0,255,0,0.2);
        }

        .parse-btn {
            padding: 20px 45px;
            background: #ff0000;
            color: #000;
            border: 4px solid #000;
            font-size: 1.3em;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-family: 'Rubik', sans-serif;
            transition: all 0.1s ease;
            position: relative;
            width: 100%;
        }

        .parse-btn:hover:not(:disabled) {
            background: #ffff00;
            transform: translate(-4px, -4px);
            box-shadow: 4px 4px 0 #ff0000;
        }

        .parse-btn:active:not(:disabled) {
            transform: translate(0, 0);
            box-shadow: none;
        }

        .parse-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            background: #333;
        }

        .status {
            margin-top: 20px;
            padding: 15px 20px;
            font-weight: 700;
            display: none;
            border-left: 6px solid;
            font-size: 0.9em;
            text-transform: uppercase;
        }

        .status.info {
            background: rgba(0,255,255,0.1);
            color: #00ffff;
            border-color: #00ffff;
        }

        .status.success {
            background: rgba(0,255,0,0.1);
            color: #00ff00;
            border-color: #00ff00;
        }

        .status.error {
            background: rgba(255,0,0,0.1);
            color: #ff0000;
            border-color: #ff0000;
        }

        .output-section {
            display: none;
        }

        .output-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 25px;
            background: #1a1a1a;
            border-bottom: 4px solid #00ff00;
        }

        .output-header h2 {
            color: #ffff00;
            font-size: 1.8em;
            font-family: 'Rubik', sans-serif;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -1px;
        }

        .stats {
            display: flex;
            gap: 30px;
        }

        .stat {
            text-align: right;
        }

        .stat-value {
            font-size: 2em;
            font-weight: 700;
            color: #00ff00;
            font-family: 'Space Mono', monospace;
        }

        .stat-label {
            font-size: 0.7em;
            color: #666;
            margin-top: 3px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .tabs {
            display: flex;
            gap: 0;
            margin-bottom: 0;
            background: #1a1a1a;
            padding: 0 25px;
        }

        .tab {
            padding: 15px 25px;
            background: #111;
            border: none;
            cursor: pointer;
            font-size: 0.9em;
            color: #666;
            text-transform: uppercase;
            font-weight: 700;
            font-family: 'Space Mono', monospace;
            letter-spacing: 1px;
            border-top: 3px solid transparent;
            transition: all 0.2s;
        }

        .tab:hover {
            color: #ffff00;
            background: #1a1a1a;
        }

        .tab.active {
            color: #000;
            background: #ffff00;
            border-top-color: #00ff00;
        }

        .copy-btn {
            margin-left: auto;
            padding: 12px 20px;
            background: #111;
            color: #00ff00;
            border: 2px solid #00ff00;
            cursor: pointer;
            font-size: 0.8em;
            font-family: 'Space Mono', monospace;
            font-weight: 700;
            text-transform: uppercase;
            transition: all 0.1s;
        }

        .copy-btn:hover {
            background: #00ff00;
            color: #000;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .markdown-preview {
            background: #0a0a0a;
            padding: 35px;
            border: 3px solid #333;
            max-height: 600px;
            overflow-y: auto;
            line-height: 1.7;
            color: #ddd;
        }

        .markdown-raw {
            background: #000;
            color: #00ff00;
            padding: 30px;
            max-height: 600px;
            overflow-y: auto;
            font-family: 'Space Mono', monospace;
            font-size: 0.85em;
            line-height: 1.8;
            white-space: pre-wrap;
            word-wrap: break-word;
            border: 3px solid #00ff00;
        }

        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 3px solid rgba(0,0,0,.3);
            border-radius: 0;
            border-top-color: #000;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Markdown styling */
        .markdown-preview h1 { font-size: 2.2em; margin: 25px 0 15px; color: #ffff00; font-family: 'Rubik', sans-serif; font-weight: 900; text-transform: uppercase; }
        .markdown-preview h2 { font-size: 1.8em; margin: 22px 0 12px; color: #00ff00; font-weight: 700; }
        .markdown-preview h3 { font-size: 1.4em; margin: 18px 0 10px; color: #00ffff; font-weight: 700; }
        .markdown-preview p { margin: 12px 0; color: #ccc; }
        .markdown-preview pre { background: #000; padding: 20px; border: 2px solid #333; overflow-x: auto; color: #00ff00; }
        .markdown-preview code { background: #1a1a1a; padding: 3px 8px; font-family: 'Space Mono', monospace; color: #00ff00; border: 1px solid #333; }
        .markdown-preview blockquote { border-left: 5px solid #ffff00; padding-left: 20px; margin: 20px 0; color: #999; background: #1a1a1a; padding: 15px 20px; }
        .markdown-preview table { border-collapse: collapse; width: 100%; margin: 20px 0; border: 3px solid #333; }
        .markdown-preview th, .markdown-preview td { border: 2px solid #333; padding: 12px; text-align: left; }
        .markdown-preview th { background: #1a1a1a; font-weight: 700; color: #ffff00; }

        /* Scrollbar styling */
        ::-webkit-scrollbar { width: 12px; height: 12px; }
        ::-webkit-scrollbar-track { background: #000; border: 2px solid #333; }
        ::-webkit-scrollbar-thumb { background: #ffff00; border: 2px solid #000; }
        ::-webkit-scrollbar-thumb:hover { background: #00ff00; }

        /* Selection styling */
        ::selection { background: #ffff00; color: #000; }
        ::-moz-selection { background: #ffff00; color: #000; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>DOC//OCR</h1>
            <p>PP-DocLayout + PaddleOCR-VL - Powered By BWS</p>
        </div>

        <div class="card">
            <div class="api-key-section">
                <label for="apiKey">→ AUTH_KEY_REQUIRED:</label>
                <input type="password" id="apiKey" placeholder="paste-api-key-here..." value="change-me-in-production">
            </div>

            <div class="upload-section">
                <div class="file-input-wrapper">
                    <input type="file" id="fileInput" accept=".pdf,.png,.jpg,.jpeg,.tiff,.tif,.bmp,.webp">
                    <label for="fileInput" class="file-input-label">
                        [SELECT FILE]
                    </label>
                </div>
                <div class="file-name" id="fileName">// No file selected...</div>
                
                <div class="vllm-toggle" style="margin: 20px 0; display: flex; flex-direction: column; gap: 10px;">
                    <label style="display: flex; align-items: center; gap: 10px; color: #ffff00; font-family: 'Space Mono', monospace; font-weight: 700; cursor: pointer;">
                        <input type="checkbox" id="useVllm" style="width: 20px; height: 20px; accent-color: #ffff00;">
                        <span>USE vLLM BACKEND (Docker/GPU server)</span>
                    </label>
                    <label style="display: flex; align-items: center; gap: 10px; color: #ff00ff; font-family: 'Space Mono', monospace; font-weight: 700; cursor: pointer;">
                        <input type="checkbox" id="useLlamaCpp" style="width: 20px; height: 20px; accent-color: #ff00ff;">
                        <span>USE LLAMA.CPP BACKEND (Fastest via genai_server)</span>
                    </label>
                    <label style="display: flex; align-items: center; gap: 10px; color: #00ff00; font-family: 'Space Mono', monospace; font-weight: 700; cursor: pointer;">
                        <input type="checkbox" id="useDocParser" style="width: 20px; height: 20px; accent-color: #00ff00;">
                        <span>USE LOCAL PADDLE VLM (Pure doc_parser / No Server)</span>
                    </label>
                </div>
                
                <button class="parse-btn" id="parseBtn" disabled>
                    RUN → PARSE
                </button>

                <div class="status" id="status"></div>
            </div>
        </div>

        <div class="card output-section" id="outputSection">
            <div class="output-header">
                <h2>╔ OUTPUT ╗</h2>
                <div class="stats">
                    <div class="stat">
                        <div class="stat-value" id="pageCount">-</div>
                        <div class="stat-label">Pages</div>
                    </div>
                    <div class="stat">
                        <div class="stat-value" id="wordCount">-</div>
                        <div class="stat-label">Words</div>
                    </div>
                </div>
            </div>

            <div class="tabs">
                <button class="tab active" data-tab="preview">[RENDERED]</button>
                <button class="tab" data-tab="raw">[RAW.MD]</button>
                <button class="copy-btn" id="copyBtn">COPY</button>
            </div>

            <div class="tab-content active" id="preview">
                <div class="markdown-preview" id="markdownPreview"></div>
            </div>

            <div class="tab-content" id="raw">
                <div class="markdown-raw" id="markdownRaw"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        const fileInput = document.getElementById('fileInput');
        const fileName = document.getElementById('fileName');
        const parseBtn = document.getElementById('parseBtn');
        const status = document.getElementById('status');
        const outputSection = document.getElementById('outputSection');
        const apiKeyInput = document.getElementById('apiKey');
        const copyBtn = document.getElementById('copyBtn');

        let currentMarkdown = '';

        // File input handler
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                const file = e.target.files[0];
                fileName.textContent = `→ LOADED: ${file.name} [${(file.size / 1024 / 1024).toFixed(2)} MB]`;
                parseBtn.disabled = false;
            } else {
                fileName.textContent = '// No file selected...';
                parseBtn.disabled = true;
            }
        });

        // Tab switching
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                const tabName = tab.dataset.tab;
                
                // Update tabs
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                
                // Update content
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                document.getElementById(tabName).classList.add('active');
            });
        });

        // Copy markdown
        copyBtn.addEventListener('click', async () => {
            try {
                await navigator.clipboard.writeText(currentMarkdown);
                const originalText = copyBtn.textContent;
                copyBtn.textContent = '[OK]';
                setTimeout(() => {
                    copyBtn.textContent = originalText;
                }, 1500);
            } catch (err) {
                console.error('Failed to copy:', err);
            }
        });

        // Show status message
        function showStatus(message, type = 'info') {
            status.textContent = message;
            status.className = `status ${type}`;
            status.style.display = 'block';
        }

        function hideStatus() {
            status.style.display = 'none';
        }

        // Parse document
        parseBtn.addEventListener('click', async () => {
            const file = fileInput.files[0];
            const apiKey = apiKeyInput.value.trim();

            if (!file) {
                showStatus('ERR: FILE_NOT_SELECTED', 'error');
                return;
            }

            if (!apiKey) {
                showStatus('ERR: AUTH_KEY_MISSING', 'error');
                return;
            }

            // Disable button and show loading
            parseBtn.disabled = true;
            const originalBtnText = parseBtn.innerHTML;
            parseBtn.innerHTML = '<span class="spinner"></span> PROCESSING...';
            outputSection.style.display = 'none';
            showStatus('→ UPLOADING... → ANALYZING LAYOUT... → EXTRACTING TEXT...', 'info');

            try {
                // Create form data
                const formData = new FormData();
                formData.append('file', file);
                
                const useVllm = document.getElementById('useVllm').checked;
                const useLlamaCpp = document.getElementById('useLlamaCpp').checked;
                const useDocParser = document.getElementById('useDocParser').checked;
                
                let parseUrl = '/parse_stream?';
                if (useVllm) parseUrl += 'use_vllm=true&';
                if (useLlamaCpp) parseUrl += 'use_llama_cpp=true&';
                if (useDocParser) parseUrl += 'use_doc_parser=true&';

                // Initial clear
                currentMarkdown = "";
                document.getElementById('markdownRaw').textContent = "";
                document.getElementById('markdownPreview').innerHTML = "";
                outputSection.style.display = 'block';

                // Use fetch for SSE (EventSource doesn't support custom headers easily)
                const response = await fetch(parseUrl, {
                    method: 'POST',
                    headers: {
                        'X-Api-Key': apiKey,
                        'Accept': 'text/event-stream'
                    },
                    body: formData
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || `HTTP_ERROR_${response.status}`);
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let accumulated = 0;
                let totalWords = 0;
                let totalPagesCount = '?';

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        if (!line.startsWith('data: ')) continue;
                        const dataStr = line.replace('data: ', '').trim();
                        if (dataStr === '[DONE]') break;

                        try {
                            const data = JSON.parse(dataStr);
                            if (data.error) throw new Error(data.error);
                            
                            if (data.status === 'prepared') {
                                totalPagesCount = data.total_pages;
                                continue;
                            }

                            if (data.markdown) {
                                accumulated++;
                                currentMarkdown += data.markdown + '\n\n---\n\n';
                                totalWords += data.word_count || 0;
                                
                                // Incremental UI updates
                                document.getElementById('pageCount').textContent = `${accumulated}/${totalPagesCount}`;
                                document.getElementById('wordCount').textContent = totalWords.toLocaleString();
                                document.getElementById('markdownRaw').textContent = currentMarkdown;
                                document.getElementById('markdownPreview').innerHTML = marked.parse(currentMarkdown);
                                
                                showStatus(`PROCESSING PAGE ${accumulated}/${totalPagesCount}...`, 'info');
                            }
                        } catch (e) {
                            console.warn("Skipping partial/invalid line:", line, e);
                        }
                    }
                }

                showStatus(`SUCCESS: PARSED ${accumulated} PAGE(S) → ${totalWords.toLocaleString()} WORDS`, 'success');

                // Scroll to results
                setTimeout(() => {
                    outputSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }, 100);

            } catch (error) {
                console.error('Parse error:', error);
                showStatus(`FATAL: ${error.message}`, 'error');
            } finally {
                // Re-enable button
                parseBtn.disabled = false;
                parseBtn.innerHTML = originalBtnText;
            }
        });

        // Allow enter key to parse
        apiKeyInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !parseBtn.disabled) {
                parseBtn.click();
            }
        });
    </script>
</body>
</html>
