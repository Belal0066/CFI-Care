<div class="graph-page" [class.chat-open]="isChatOpen">
  <div class="graph-container" style="position: relative;">
    @if (loading) {
    <div
      style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; align-items: center; background: rgba(255,255,255,0.9); z-index: 10;">
      <p>Loading graph for patient {{ patientId }}...</p>
    </div>
    }
    @if (error) {
    <div
      style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; align-items: center; background: rgba(255,255,255,0.9); z-index: 10; color: red;">
      <p>{{ error }}</p>
    </div>
    }

    <iframe #graphFrame src="/assets/med-graph_legacy.html" class="graph-frame">
    </iframe>
  </div>

  <app-chat-section class="chat-container" [showChatbot]="isChatOpen" (close)="toggleChat()">
  </app-chat-section>

  <button class="fab-toggle" (click)="toggleChat()" [class.active]="isChatOpen" aria-label="Toggle AI Assistant"
    style="padding: 0px 2px; border-top: none; border-bottom: none;">
    <span *ngIf="!isChatOpen">AI</span>
    <span *ngIf="isChatOpen"><i class="bi bi-caret-right"></i></span>
    <i class="bi bi-caret-left"></i>
  </button>
</div>
