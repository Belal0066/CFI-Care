<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MedFlow Graph — Full Test Suite</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --surface2: #18181f;
    --border: #2a2a38;
    --accent: #6c63ff;
    --accent2: #00d4aa;
    --pass: #00d4aa;
    --fail: #ff4d6a;
    --warn: #ffb830;
    --skip: #7c7c9a;
    --text: #e8e8f0;
    --text2: #9898b0;
    --text3: #5c5c78;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Syne', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── HEADER ── */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 20px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-left { display: flex; align-items: center; gap: 16px; }

  .logo {
    font-family: var(--sans);
    font-size: 22px;
    font-weight: 800;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .badge {
    font-size: 10px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 4px;
    background: rgba(108,99,255,0.15);
    color: var(--accent);
    border: 1px solid rgba(108,99,255,0.3);
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .run-btn {
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 700;
    padding: 10px 24px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: white;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.5px;
  }

  .run-btn:hover { background: #7d75ff; transform: translateY(-1px); }
  .run-btn:active { transform: translateY(0); }
  .run-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  /* ── SCOREBOARD ── */
  .scoreboard {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 1px;
    background: var(--border);
    border-bottom: 1px solid var(--border);
  }

  .score-cell {
    background: var(--surface);
    padding: 16px 20px;
    text-align: center;
  }

  .score-num {
    font-family: var(--sans);
    font-size: 32px;
    font-weight: 800;
    line-height: 1;
    margin-bottom: 4px;
  }

  .score-label {
    font-size: 10px;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    font-weight: 500;
  }

  .score-cell.total .score-num  { color: var(--text); }
  .score-cell.passed .score-num { color: var(--pass); }
  .score-cell.failed .score-num { color: var(--fail); }
  .score-cell.warned .score-num { color: var(--warn); }
  .score-cell.skipped .score-num { color: var(--skip); }
  .score-cell.perf .score-num { color: var(--accent2); }

  /* ── PROGRESS BAR ── */
  .progress-wrap {
    height: 3px;
    background: var(--surface2);
  }

  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    width: 0%;
    transition: width 0.3s ease;
  }

  /* ── LAYOUT ── */
  .main {
    display: grid;
    grid-template-columns: 260px 1fr;
    height: calc(100vh - 120px);
    overflow: hidden;
  }

  /* ── SIDEBAR NAV ── */
  .sidebar {
    background: var(--surface);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 12px 0;
  }

  .sidebar::-webkit-scrollbar { width: 4px; }
  .sidebar::-webkit-scrollbar-track { background: transparent; }
  .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .nav-section {
    padding: 8px 16px 4px;
    font-size: 9px;
    font-weight: 700;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 2px;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    cursor: pointer;
    transition: background 0.15s;
    border-left: 2px solid transparent;
  }

  .nav-item:hover { background: var(--surface2); }
  .nav-item.active { background: rgba(108,99,255,0.08); border-left-color: var(--accent); }

  .nav-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
    background: var(--text3);
    transition: background 0.2s;
  }

  .nav-dot.pass  { background: var(--pass); }
  .nav-dot.fail  { background: var(--fail); }
  .nav-dot.warn  { background: var(--warn); }
  .nav-dot.run   { background: var(--accent); animation: pulse 1s ease infinite; }
  .nav-dot.skip  { background: var(--skip); }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.85); }
  }

  .nav-name { font-size: 11px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .nav-count { font-size: 10px; color: var(--text3); }

  /* ── CONTENT ── */
  .content {
    overflow-y: auto;
    padding: 0;
  }

  .content::-webkit-scrollbar { width: 6px; }
  .content::-webkit-scrollbar-track { background: transparent; }
  .content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* ── SUITE BLOCK ── */
  .suite {
    border-bottom: 1px solid var(--border);
  }

  .suite-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 24px;
    background: var(--surface2);
    cursor: pointer;
    user-select: none;
    position: sticky;
    top: 0;
    z-index: 10;
    border-bottom: 1px solid var(--border);
  }

  .suite-header:hover { background: #1e1e28; }

  .suite-icon {
    font-size: 16px;
    width: 24px;
    text-align: center;
  }

  .suite-name {
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    flex: 1;
  }

  .suite-stats {
    display: flex;
    gap: 12px;
    font-size: 11px;
  }

  .suite-stats span { color: var(--text3); }
  .suite-stats .p { color: var(--pass); }
  .suite-stats .f { color: var(--fail); }
  .suite-stats .w { color: var(--warn); }

  .suite-chevron {
    font-size: 10px;
    color: var(--text3);
    transition: transform 0.2s;
  }

  .suite.collapsed .suite-chevron { transform: rotate(-90deg); }
  .suite.collapsed .test-list { display: none; }

  /* ── TEST LIST ── */
  .test-list { padding: 4px 0; }

  .test-row {
    display: grid;
    grid-template-columns: 28px 1fr auto auto;
    gap: 8px;
    align-items: start;
    padding: 10px 24px;
    border-bottom: 1px solid rgba(42,42,56,0.4);
    transition: background 0.15s;
  }

  .test-row:hover { background: rgba(255,255,255,0.015); }

  .test-row:last-child { border-bottom: none; }

  .test-status-icon {
    font-size: 13px;
    text-align: center;
    margin-top: 1px;
  }

  .test-body { min-width: 0; }

  .test-name {
    font-size: 12px;
    color: var(--text);
    margin-bottom: 3px;
    line-height: 1.4;
    font-weight: 500;
  }

  .test-desc {
    font-size: 11px;
    color: var(--text3);
    line-height: 1.5;
    margin-bottom: 4px;
  }

  .test-error {
    font-size: 11px;
    color: var(--fail);
    background: rgba(255,77,106,0.06);
    border: 1px solid rgba(255,77,106,0.15);
    border-radius: 4px;
    padding: 6px 10px;
    margin-top: 4px;
    line-height: 1.5;
    white-space: pre-wrap;
  }

  .test-warn-msg {
    font-size: 11px;
    color: var(--warn);
    background: rgba(255,184,48,0.06);
    border: 1px solid rgba(255,184,48,0.15);
    border-radius: 4px;
    padding: 6px 10px;
    margin-top: 4px;
  }

  .test-info {
    font-size: 11px;
    color: var(--accent2);
    background: rgba(0,212,170,0.05);
    border: 1px solid rgba(0,212,170,0.15);
    border-radius: 4px;
    padding: 6px 10px;
    margin-top: 4px;
  }

  .test-tag {
    font-size: 9px;
    padding: 2px 7px;
    border-radius: 3px;
    font-weight: 700;
    letter-spacing: 0.5px;
    white-space: nowrap;
    align-self: start;
  }

  .tag-pass { background: rgba(0,212,170,0.1); color: var(--pass); }
  .tag-fail { background: rgba(255,77,106,0.1); color: var(--fail); }
  .tag-warn { background: rgba(255,184,48,0.1); color: var(--warn); }
  .tag-skip { background: rgba(124,124,154,0.1); color: var(--skip); }
  .tag-run  { background: rgba(108,99,255,0.1); color: var(--accent); }

  .test-time {
    font-size: 10px;
    color: var(--text3);
    white-space: nowrap;
    align-self: start;
    margin-top: 2px;
  }

  /* ── PERF CHART ── */
  .perf-panel {
    padding: 24px;
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
  }

  .perf-title {
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 700;
    color: var(--text2);
    margin-bottom: 16px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .perf-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
  }

  .perf-label {
    font-size: 11px;
    color: var(--text2);
    width: 220px;
    flex-shrink: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .perf-bar-wrap {
    flex: 1;
    background: var(--border);
    height: 6px;
    border-radius: 3px;
    overflow: hidden;
  }

  .perf-bar-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 0.6s ease;
  }

  .perf-val {
    font-size: 11px;
    width: 70px;
    text-align: right;
    flex-shrink: 0;
  }

  .perf-pass { background: var(--pass); }
  .perf-warn { background: var(--warn); }
  .perf-fail { background: var(--fail); }

  /* ── LOG CONSOLE ── */
  .console-wrap {
    padding: 24px;
    border-bottom: 1px solid var(--border);
  }

  .console-title {
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 700;
    color: var(--text2);
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .console-body {
    background: #0c0c12;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    max-height: 220px;
    overflow-y: auto;
    font-size: 11px;
    line-height: 1.7;
    color: var(--text2);
  }

  .console-body::-webkit-scrollbar { width: 4px; }
  .console-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .log-pass  { color: var(--pass); }
  .log-fail  { color: var(--fail); }
  .log-warn  { color: var(--warn); }
  .log-info  { color: var(--accent2); }
  .log-dim   { color: var(--text3); }

  /* ── IDLE / LOADING ── */
  .idle-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 16px;
    color: var(--text3);
  }

  .idle-icon {
    font-size: 48px;
    opacity: 0.3;
  }

  .idle-text {
    font-family: var(--sans);
    font-size: 16px;
    font-weight: 600;
  }

  .idle-sub { font-size: 12px; }

  .spinner {
    width: 40px;
    height: 40px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── IFRAME (hidden) ── */
  #test-frame {
    position: fixed;
    left: -9999px;
    top: -9999px;
    width: 1400px;
    height: 900px;
    border: none;
    visibility: hidden;
  }

  /* ── REPORT DOWNLOAD ── */
  .report-btn {
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 600;
    padding: 8px 18px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text2);
    cursor: pointer;
    transition: all 0.2s;
  }

  .report-btn:hover { border-color: var(--accent2); color: var(--accent2); }

  .header-actions { display: flex; align-items: center; gap: 10px; }

  /* ── METRIC CARDS ── */
  .metrics-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    padding: 20px 24px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }

  .metric-card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
  }

  .metric-card-label {
    font-size: 10px;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 6px;
    font-weight: 600;
  }

  .metric-card-value {
    font-family: var(--sans);
    font-size: 22px;
    font-weight: 700;
  }

  .metric-card-sub { font-size: 10px; color: var(--text3); margin-top: 2px; }

  /* Filter bar */
  .filter-bar {
    display: flex;
    gap: 6px;
    padding: 10px 24px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }

  .filter-chip {
    font-size: 10px;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text3);
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .filter-chip.active { background: rgba(108,99,255,0.12); color: var(--accent); border-color: rgba(108,99,255,0.3); }
  .filter-chip.pass { }
  .filter-chip.fail { }
</style>
</head>
<body>

<iframe id="test-frame" src="about:blank"></iframe>

<header class="header">
  <div class="header-left">
    <span class="logo">CFI-Care Tests</span>
    <span class="badge">v2.0</span>
  </div>
  <div class="header-actions">
    <button class="report-btn" id="downloadBtn" style="display:none" onclick="downloadReport()">⬇ Export Report</button>
    <button class="run-btn" id="runBtn" onclick="runAllTests()">▶ Run All Tests</button>
  </div>
</header>

<div class="scoreboard" id="scoreboard">
  <div class="score-cell total">  <div class="score-num" id="sc-total">—</div>  <div class="score-label">Total</div></div>
  <div class="score-cell passed"> <div class="score-num" id="sc-pass">—</div>   <div class="score-label">Passed</div></div>
  <div class="score-cell failed"> <div class="score-num" id="sc-fail">—</div>   <div class="score-label">Failed</div></div>
  <div class="score-cell warned"> <div class="score-num" id="sc-warn">—</div>   <div class="score-label">Warned</div></div>
  <div class="score-cell skipped"><div class="score-num" id="sc-skip">—</div>   <div class="score-label">Skipped</div></div>
  <div class="score-cell perf">   <div class="score-num" id="sc-time">—</div>   <div class="score-label">ms Total</div></div>
</div>

<div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>

<div class="main">
  <aside class="sidebar" id="sidebar">
    <div class="nav-section">Test Suites</div>
    <!-- nav items injected here -->
  </aside>

  <div class="content" id="content">
    <div class="idle-state" id="idleState">
      <div class="idle-icon">🧪</div>
      <div class="idle-text">MedFlow Graph Test Suite</div>
      <div class="idle-sub">65 tests across 5 suites — click Run All Tests to begin</div>
    </div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════════════════════════
//  TEST ENGINE
// ══════════════════════════════════════════════════════════════════════

const results = {
  suites: [],
  totalPass: 0, totalFail: 0, totalWarn: 0, totalSkip: 0,
  totalTime: 0, perfResults: []
};

let activeFilter = 'all';
let iframe, iDoc, iWin;

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function assert(cond, msg) {
  if (!cond) throw new Error(msg);
}

function assertEq(a, b, msg) {
  if (a !== b) throw new Error(`${msg}: expected ${JSON.stringify(b)}, got ${JSON.stringify(a)}`);
}

function warn(msg) {
  const e = new Error(msg);
  e.isWarning = true;
  throw e;
}

// ── Load the graph in hidden iframe ──────────────────────────────────
async function loadGraph() {
  iframe = document.getElementById('test-frame');
  const graphUrl = document.getElementById('graphSrcInput')?.value || '';

  return new Promise((resolve, reject) => {
    iframe.onload = () => {
      iDoc = iframe.contentDocument;
      iWin  = iframe.contentWindow;
      // wait for scripts
      setTimeout(() => {
        if (iWin && typeof iWin.data !== 'undefined') resolve();
        else reject(new Error('Graph JS failed to initialise (data not found)'));
      }, 1200);
    };
    iframe.onerror = () => reject(new Error('iframe failed to load'));

    // ── Inline the graph HTML directly into the iframe ──────────────
    const src = `./medflow-graph.html`;
    iframe.src = src;

    // Fallback: inject the embedded copy
    setTimeout(() => {
      try {
        if (!iWin || typeof iWin.data === 'undefined') {
          // write embedded graph
          iframe.onload = null;
          iDoc = iframe.contentDocument;
          iDoc.open();
          iDoc.write(GRAPH_HTML);
          iDoc.close();
          setTimeout(() => {
            iWin = iframe.contentWindow;
            iDoc = iframe.contentDocument;
            resolve();
          }, 1500);
        }
      } catch(e) { /* cross-origin, skip */ }
    }, 2500);
  });
}

// ══════════════════════════════════════════════════════════════════════
//  MOCK ENVIRONMENT — runs tests against a controlled JS environment
//  instead of loading the actual iframe (more reliable, no CORS issues)
// ══════════════════════════════════════════════════════════════════════

function buildMockEnv() {
  // Reproduce the core data model and all pure-JS logic from the graph

  const CATEGORY_COLORS = {
    Consultation:"#3B82F6", Lab:"#10B981", Imaging:"#8B5CF6",
    Prescription:"#F59E0B", AISuggestion:"#EC4899", FollowUp:"#06B6D4",
    Allergy:"#EF4444", Historical:"#6B7280", Linker:"#A855F7"
  };

  // ── Baseline mock dataset (mirrors the graph's mock data) ─────────
  const MOCK_DATA = [
    { id:"1",  text_1:"Initial Consultation", father:null, category:"Consultation", priority:"Medium", normality:"Normal",   dateIssued:"2024-01-10", details:"Patient presents with chest pain." },
    { id:"2",  text_1:"CBC Blood Test",       father:"1",  category:"Lab",          priority:"High",   normality:"Abnormal",  dateIssued:"2024-01-11", details:"WBC elevated at 14.2." },
    { id:"3",  text_1:"Chest X-Ray",          father:"1",  category:"Imaging",      priority:"High",   normality:"Abnormal",  dateIssued:"2024-01-11", details:"Mild cardiomegaly." },
    { id:"4",  text_1:"Cardiology Referral",  father:"1",  category:"Consultation", priority:"High",   normality:"Normal",    dateIssued:"2024-01-12", details:"Referred to Dr. Hassan." },
    { id:"5",  text_1:"Cardiac Diagnosis",    father:"4",  category:"Consultation", priority:"High",   normality:"Abnormal",  dateIssued:"2024-01-14", details:"Dilated cardiomyopathy.", isDiagnosis:true, isManualBranch:true, branchState:"in_progress" },
    { id:"6",  text_1:"Echo Cardiogram",      father:"5",  category:"Imaging",      priority:"High",   normality:"Abnormal",  dateIssued:"2024-01-15", details:"EF 35%." },
    { id:"7",  text_1:"Beta Blockers",        father:"5",  category:"Prescription", priority:"Medium", normality:"Normal",    dateIssued:"2024-01-16", details:"Metoprolol 50mg." },
    { id:"8",  text_1:"Penicillin Allergy",   father:"1",  category:"Allergy",      priority:"High",   normality:"Abnormal",  dateIssued:"2024-01-10", details:"Severe allergy." },
    { id:"9",  text_1:"Lipid Panel",          father:"2",  category:"Lab",          priority:"Medium", normality:"Abnormal",  dateIssued:"2024-01-13", details:"LDL 180 mg/dL." },
    { id:"10", text_1:"Statin Prescription",  father:"9",  category:"Prescription", priority:"Medium", normality:"Normal",    dateIssued:"2024-01-14", details:"Atorvastatin 40mg." },
    { id:"11", text_1:"2-Week Follow Up",     father:"5",  category:"FollowUp",     priority:"Medium", normality:"Normal",    dateIssued:"2024-01-28", details:"Patient improving." },
    { id:"12", text_1:"AI Risk Assessment",   father:"1",  category:"AISuggestion", priority:"Medium", normality:"Pending",   dateIssued:"2024-01-12", details:"68% probability of cardiac event." },
  ];

  // ── Pure functions extracted from the graph ──────────────────────

  function deepClone(d) { return JSON.parse(JSON.stringify(d)); }

  function dataHasChildren(data, nodeId) {
    return data.some(d => d.father === nodeId);
  }

  function isNodeInRejectedBranch(data, nodeId) {
    let current = data.find(d => d.id === nodeId);
    while (current) {
      if ((current.isDiagnosis || current.isManualBranch) && current.branchState === "discontinued") return true;
      if (current.father === null) break;
      current = data.find(d => d.id === current.father);
    }
    return false;
  }

  function isNodeInCompletedBranch(data, nodeId) {
    const completedStarters = data.filter(d => (d.isDiagnosis||d.isManualBranch) && d.branchState==="completed");
    for (const starter of completedStarters) {
      const members = new Set([starter.id]);
      const collect = id => data.forEach(n => { if(n.father===id&&!members.has(n.id)){members.add(n.id);collect(n.id);} });
      collect(starter.id);
      if (members.has(nodeId)) return true;
    }
    return false;
  }

  function isLinkerNode(data, nodeId) {
    const node = data.find(d => d.id === nodeId);
    return node?.category === "Linker" || !!node?._linkedBranchId;
  }

  function deleteRecursive(data, id) {
    const children = data.filter(d => d.father === id);
    children.forEach(c => deleteRecursive(data, c.id));
    const idx = data.findIndex(d => d.id === id);
    if (idx !== -1) data.splice(idx, 1);
  }

  function collectNodesRecursive(data, id) {
    const result = [];
    const node = data.find(d => d.id === id);
    if (node) {
      result.push({...node});
      data.filter(d => d.father === id).forEach(c => result.push(...collectNodesRecursive(data, c.id)));
    }
    return result;
  }

  function slotFitsSchedule(slot, sched) {
    return new Date(slot.start) >= new Date(sched.start) && new Date(slot.end) <= new Date(sched.end);
  }

  function getChronologicalData(data, filters) {
    const { selectedCategories, selectedPriorities, selectedNormalities, startDate, endDate, selectedDiagnosis } = filters;

    const filteredData = data.filter(node => {
      const nodeDate = new Date(node.dateIssued);
      return selectedCategories.includes(node.category) &&
        selectedPriorities.includes(node.priority) &&
        selectedNormalities.includes(node.normality) &&
        (!startDate || nodeDate >= startDate) &&
        (!endDate || nodeDate <= endDate) &&
        (selectedDiagnosis || !node.isDiagnosis);
    });

    const branches = new Map();
    let nextLaneId = 1;
    const branchStarters = new Set(filteredData.filter(n=>n.isDiagnosis||n.isManualBranch).map(n=>n.id));
    branchStarters.forEach(startId => {
      const members = new Set([startId]);
      const findDesc = nodeId => filteredData.forEach(n=>{if(n.father===nodeId&&!members.has(n.id)){members.add(n.id);findDesc(n.id);}});
      findDesc(startId);
      branches.set(startId, { laneId: nextLaneId++, members, startId });
    });

    return filteredData.map(node => {
      let laneId = 0, branchStartId = null;
      for (const [sid, bi] of branches) {
        if (bi.members.has(node.id)) { laneId = bi.laneId; branchStartId = sid; break; }
      }
      return { ...node, laneId, branchStartId, originalFather: node.father, isBranchStart: node.isDiagnosis||node.isManualBranch };
    }).sort((a,b) => {
      const da = new Date(a.dateIssued).getTime(), db = new Date(b.dateIssued).getTime();
      if (da !== db) return da - db;
      if (a.laneId !== b.laneId) return a.laneId - b.laneId;
      return a.id - b.id;
    });
  }

  const defaultFilters = {
    selectedCategories: Object.keys(CATEGORY_COLORS),
    selectedPriorities: ["Low","Medium","High"],
    selectedNormalities: ["Normal","Abnormal","Pending"],
    startDate: null, endDate: null, selectedDiagnosis: true
  };

  return {
    MOCK_DATA, CATEGORY_COLORS, deepClone, dataHasChildren,
    isNodeInRejectedBranch, isNodeInCompletedBranch, isLinkerNode,
    deleteRecursive, collectNodesRecursive, slotFitsSchedule,
    getChronologicalData, defaultFilters
  };
}

            const expansionOrder = [];

            function expandFirstLevel(nodeId) {
              if (expansionOrder.length >= MAX_EXPANDED) {
                const oldest = expansionOrder.shift();
                expandedNodes.delete(oldest);
              }
              expansionOrder.push(nodeId);
              expandedNodes.add(nodeId);
            }

            expandFirstLevel('2');
            expandFirstLevel('3');
            assert(expandedNodes.has('2') && expandedNodes.has('3'), 'Both should be expanded');
            expandFirstLevel('4');
            assert(!expandedNodes.has('2'), 'Node 2 should have been evicted');
            assert(expandedNodes.has('3'), 'Node 3 should still be expanded');
            assert(expandedNodes.has('4'), 'Node 4 should now be expanded');
            assertEq(expansionOrder.length, 2, `expansionOrder should have 2 items`);
          }
        },
        {
          name: 'Categorical: Linker nodes filtered out of categorical view',
          desc: 'Linker nodes must never appear in categorical view.',
          run() {
            const data = fresh();
            data.push({ id:'L1', text_1:'Merge', father:'1', category:'Linker', priority:'Low', normality:'Normal', dateIssued:'2024-01-28', details:'Auto', _linkedBranchId:'5' });
            const visible = data.filter(n=>n.category!=='Linker');
            assert(!visible.find(n=>n.id==='L1'), 'Linker node should be excluded');
            assert(visible.find(n=>n.id==='1'), 'Normal nodes should still be present');
          }
        },
        {
          name: 'Categorical: virtual root created when multiple root nodes present',
          desc: 'If two nodes have father=null, a virtual root should unify them.',
          run() {
            const data = fresh();
            // Simulate a second root
            data.push({ id:'ROOT2', text_1:'Second Journey', father:null, category:'Consultation', priority:'Low', normality:'Normal', dateIssued:'2024-03-01', details:'Another journey' });
            const roots = data.filter(n=>n.father===null);
            assert(roots.length > 1, 'Should have multiple roots to trigger virtual root');
            // Graph code would create a virtual root and re-parent
            const virtualRootId = '__virtual_root__';
            const virtualRoot = { id:virtualRootId, text_1:'Patient Journey', father:null, isVirtualRoot:true, category:'Consultation', priority:'Low', normality:'Normal', dateIssued:new Date().toISOString().split('T')[0], details:'Virtual' };
            const patched = [virtualRoot, ...data.map(n => n.father===null && n.id!==virtualRootId ? {...n, father:virtualRootId} : n)];
            const newRoots = patched.filter(n=>n.father===null);
            assertEq(newRoots.length, 1, 'After virtual root, exactly 1 root should exist');
            assertEq(newRoots[0].id, virtualRootId, 'Virtual root should be the sole root');
          }
        },
        {
          name: 'Categorical: collapse removes all descendants from visible set',
          desc: 'Collapsing an expanded node must hide all its descendants.',
          run() {
            const data = fresh();
            const expandedNodes = new Set(['1','5']);

            function removeAllDescendants(nodeId) {
              const children = data.filter(d=>d.father===nodeId);
              children.forEach(child => { expandedNodes.delete(child.id); removeAllDescendants(child.id); });
            }

            function addAllDescendants(nodeId) {
              const children = data.filter(d=>d.father===nodeId);
              children.forEach(child => { expandedNodes.add(child.id); addAllDescendants(child.id); });
            }

            addAllDescendants('5');
            assert(expandedNodes.has('6'), 'Node 6 should be in expanded set after expand');
            removeAllDescendants('5');
            assert(!expandedNodes.has('6'), 'Node 6 should not be in expanded set after collapse');
            assert(!expandedNodes.has('7'), 'Node 7 should not be in expanded set after collapse');
          }
        },
      ]
    },

const LOG = [];

function log(cls, msg) {
  LOG.push({ cls, msg });
  const el = document.getElementById('logBody');
  if (el) {
    el.innerHTML += `<div class="log-${cls}">${msg}</div>`;
    el.scrollTop = el.scrollHeight;
  }
}

async function runAllTests() {
  const runBtn = document.getElementById('runBtn');
  runBtn.disabled = true;
  runBtn.textContent = '⏳ Running…';
  document.getElementById('downloadBtn').style.display = 'none';
  document.getElementById('idleState').style.display = 'none';

  LOG.length = 0;
  results.suites = [];
  results.totalPass = 0; results.totalFail = 0;
  results.totalWarn = 0; results.totalSkip = 0;
  results.totalTime = 0; results.perfResults = [];

  updateScoreboard();

  const env = buildMockEnv();
  const suites = defineTests(env);

  // Render skeleton
  document.getElementById('content').innerHTML = '';
  document.getElementById('sidebar').innerHTML = '<div class="nav-section">Test Suites</div>';

  const navItems = {};
  suites.forEach(suite => {
    const ni = document.createElement('div');
    ni.className = 'nav-item';
    ni.id = `nav-${suite.id}`;
    ni.innerHTML = `<div class="nav-dot run" id="ndot-${suite.id}"></div><span class="nav-name">${suite.name}</span><span class="nav-count" id="ncount-${suite.id}">…</span>`;
    ni.onclick = () => document.getElementById(`suite-${suite.id}`)?.scrollIntoView({ behavior:'smooth' });
    document.getElementById('sidebar').appendChild(ni);
    navItems[suite.id] = ni;
  });

  // Run each suite
  for (const suite of suites) {
    const suiteResult = { id: suite.id, name: suite.name, icon: suite.icon, tests: [], pass:0, fail:0, warn:0 };
    results.suites.push(suiteResult);
    log('info', `▶ Suite: ${suite.name}`);

    for (const test of suite.tests) {
      const tr = { name: test.name, desc: test.desc, status: 'run', error: null, time: 0 };
      suiteResult.tests.push(tr);

      // Render running state immediately
      renderResults();

      const t0 = performance.now();
      try {
        await test.run();
        tr.time = performance.now() - t0;
        tr.status = 'pass';
        suiteResult.pass++;
        results.totalPass++;
        log('pass', `  ✓ ${test.name} (${tr.time.toFixed(2)}ms)`);
      } catch (e) {
        tr.time = performance.now() - t0;
        tr.error = e.message;
        if (e.isWarning) {
          tr.status = 'warn';
          suiteResult.warn++;
          results.totalWarn++;
          log('warn', `  ⚠ ${test.name}: ${e.message}`);
        } else {
          tr.status = 'fail';
          suiteResult.fail++;
          results.totalFail++;
          log('fail', `  ✗ ${test.name}: ${e.message}`);
        }
      }
      results.totalTime += tr.time;

      // Small yield to keep UI responsive
      await sleep(8);
    }

    // Update nav dot
    const dot = document.getElementById(`ndot-${suite.id}`);
    const ncount = document.getElementById(`ncount-${suite.id}`);
    if (dot) {
      dot.className = 'nav-dot ' + (suiteResult.fail > 0 ? 'fail' : suiteResult.warn > 0 ? 'warn' : 'pass');
    }
    if (ncount) {
      ncount.textContent = `${suiteResult.pass}/${suiteResult.tests.length}`;
    }

    log('dim', `  → ${suiteResult.pass} passed, ${suiteResult.fail} failed, ${suiteResult.warn} warned`);
  }

  renderResults();
  updateScoreboard();

  runBtn.disabled = false;
  runBtn.textContent = '↺ Re-run';
  document.getElementById('downloadBtn').style.display = '';

  log('info', `Done. ${results.totalPass} passed · ${results.totalFail} failed · ${results.totalWarn} warned · ${results.totalTime.toFixed(1)}ms total`);
}

function updateScoreboard() {
  const total = results.totalPass + results.totalFail + results.totalWarn + results.totalSkip;
  document.getElementById('sc-total').textContent = total || '—';
  document.getElementById('sc-pass').textContent  = results.totalPass  || (total ? '0' : '—');
  document.getElementById('sc-fail').textContent  = results.totalFail  || (total ? '0' : '—');
  document.getElementById('sc-warn').textContent  = results.totalWarn  || (total ? '0' : '—');
  document.getElementById('sc-skip').textContent  = results.totalSkip  || (total ? '0' : '—');
  document.getElementById('sc-time').textContent  = total ? results.totalTime.toFixed(0) : '—';

  const pct = total > 0 ? ((results.totalPass / total) * 100) : 0;
  document.getElementById('progressBar').style.width = pct + '%';
}

function statusIcon(s) {
  return { pass:'✓', fail:'✗', warn:'⚠', skip:'—', run:'…' }[s] || '?';
}

function statusClass(s) {
  return { pass:'tag-pass', fail:'tag-fail', warn:'tag-warn', skip:'tag-skip', run:'tag-run' }[s] || '';
}

function statusLabel(s) {
  return { pass:'PASS', fail:'FAIL', warn:'WARN', skip:'SKIP', run:'RUNNING' }[s] || s;
}

function renderResults() {
  const content = document.getElementById('content');

  // Compute coverage metrics
  const total = results.totalPass + results.totalFail + results.totalWarn;
  const passRate = total > 0 ? ((results.totalPass / total)*100).toFixed(1) : '—';
  const avgTime  = total > 0 ? (results.totalTime / total).toFixed(2) : '—';
  const fastest  = total > 0 ? Math.min(...results.suites.flatMap(s=>s.tests).filter(t=>t.time>0).map(t=>t.time)).toFixed(2) : '—';
  const slowest  = total > 0 ? Math.max(...results.suites.flatMap(s=>s.tests).map(t=>t.time)).toFixed(2) : '—';
  const failRate = total > 0 ? ((results.totalFail / total)*100).toFixed(1) : '—';
  const coverage = results.suites.length > 0 ? 
    (results.suites.flatMap(s=>s.tests).filter(t=>t.status!=='run').length / 
     results.suites.flatMap(s=>s.tests).length * 100).toFixed(0) : 0;

  let html = `
    <div class="metrics-grid">
      <div class="metric-card">
        <div class="metric-card-label">Pass Rate</div>
        <div class="metric-card-value" style="color:var(--pass)">${passRate}%</div>
        <div class="metric-card-sub">${results.totalPass} of ${total} tests</div>
      </div>
      <div class="metric-card">
        <div class="metric-card-label">Avg Test Time</div>
        <div class="metric-card-value" style="color:var(--accent2)">${avgTime}ms</div>
        <div class="metric-card-sub">Fastest: ${fastest}ms · Slowest: ${slowest}ms</div>
      </div>
      <div class="metric-card">
        <div class="metric-card-label">Failure Rate</div>
        <div class="metric-card-value" style="color:${parseFloat(failRate)>0?'var(--fail)':'var(--pass)'}">${failRate}%</div>
        <div class="metric-card-sub">${results.totalFail} failures · ${results.totalWarn} warnings</div>
      </div>
      <div class="metric-card">
        <div class="metric-card-label">Suites Run</div>
        <div class="metric-card-value" style="color:var(--accent)">${results.suites.filter(s=>s.tests.some(t=>t.status!=='run')).length}/${results.suites.length}</div>
        <div class="metric-card-sub">Total execution: ${results.totalTime.toFixed(1)}ms</div>
      </div>
      <div class="metric-card">
        <div class="metric-card-label">Tests Run</div>
        <div class="metric-card-value" style="color:var(--text)">${coverage}%</div>
        <div class="metric-card-sub">${results.suites.flatMap(s=>s.tests).filter(t=>t.status!=='run').length} of ${results.suites.flatMap(s=>s.tests).length} complete</div>
      </div>
      <div class="metric-card">
        <div class="metric-card-label">Warnings</div>
        <div class="metric-card-value" style="color:var(--warn)">${results.totalWarn}</div>
        <div class="metric-card-sub">Non-blocking issues</div>
      </div>
    </div>
  `;

  // Perf bar chart (if any perf results)
  if (results.perfResults.length > 0) {
    const maxMs = Math.max(...results.perfResults.map(p=>Math.max(p.ms, p.budget))) * 1.2;
    html += `<div class="perf-panel"><div class="perf-title">⚡ Performance Metrics</div>`;
    results.perfResults.forEach(p => {
      const pct = Math.min((p.ms / maxMs) * 100, 100);
      const budgetPct = Math.min((p.budget / maxMs) * 100, 100);
      const cls = p.ms <= p.budget * 0.7 ? 'perf-pass' : p.ms <= p.budget ? 'perf-warn' : 'perf-fail';
      const valColor = p.ms <= p.budget ? 'var(--pass)' : 'var(--fail)';
      html += `
        <div class="perf-row">
          <div class="perf-label" title="${p.label}">${p.label}</div>
          <div class="perf-bar-wrap" style="position:relative">
            <div class="perf-bar-fill ${cls}" style="width:${pct}%"></div>
            <div style="position:absolute;top:0;left:${budgetPct}%;width:2px;height:100%;background:rgba(255,255,255,0.25);"></div>
          </div>
          <div class="perf-val" style="color:${valColor}">${p.ms.toFixed(3)}ms</div>
        </div>
      `;
    });
    html += `<div style="font-size:10px;color:var(--text3);margin-top:8px;">White line = budget threshold. Green = well under budget · Yellow = near limit · Red = over budget.</div>`;
    html += `</div>`;
  }

  // Suite blocks
  results.suites.forEach(suite => {
    const allDone = suite.tests.every(t=>t.status!=='run');
    html += `
      <div class="suite" id="suite-${suite.id}">
        <div class="suite-header" onclick="this.closest('.suite').classList.toggle('collapsed')">
          <div class="suite-icon">${suite.icon}</div>
          <div class="suite-name">${suite.name}</div>
          <div class="suite-stats">
            <span class="p">✓ ${suite.pass}</span>
            <span class="f">✗ ${suite.fail}</span>
            ${suite.warn ? `<span class="w">⚠ ${suite.warn}</span>` : ''}
            <span>${suite.tests.length} tests</span>
          </div>
          <span class="suite-chevron">▾</span>
        </div>
        <div class="test-list">
    `;

    suite.tests.forEach((t, i) => {
      const icon = { pass:'✓', fail:'✗', warn:'⚠', skip:'—', run:'…' }[t.status] || '?';
      const iconColor = { pass:'var(--pass)', fail:'var(--fail)', warn:'var(--warn)', skip:'var(--skip)', run:'var(--accent)' }[t.status];

      let extra = '';
      if (t.status === 'fail' && t.error) {
        extra = `<div class="test-error">✗ ${t.error}</div>`;
      } else if (t.status === 'warn' && t.error) {
        extra = `<div class="test-warn-msg">⚠ ${t.error}</div>`;
      } else if (t.status === 'pass') {
        extra = `<div class="test-info">All assertions passed</div>`;
      }

      html += `
        <div class="test-row">
          <div class="test-status-icon" style="color:${iconColor}">${icon}</div>
          <div class="test-body">
            <div class="test-name">${t.name}</div>
            <div class="test-desc">${t.desc}</div>
            ${extra}
          </div>
          <div class="test-tag ${statusClass(t.status)}">${statusLabel(t.status)}</div>
          <div class="test-time">${t.time > 0 ? t.time.toFixed(2)+'ms' : ''}</div>
        </div>
      `;
    });

    html += `</div></div>`;
  });

  // Console log
  html += `
    <div class="console-wrap">
      <div class="console-title">📋 Test Log</div>
      <div class="console-body" id="logBody">
        ${LOG.map(l=>`<div class="log-${l.cls}">${l.msg}</div>`).join('')}
      </div>
    </div>
  `;

  content.innerHTML = html;

  // Re-scroll log
  const logEl = document.getElementById('logBody');
  if (logEl) logEl.scrollTop = logEl.scrollHeight;
}

// ── Report export ────────────────────────────────────────────────────
function downloadReport() {
  const ts = new Date().toISOString().replace(/[:.]/g,'-').slice(0,19);
  const total = results.totalPass + results.totalFail + results.totalWarn;
  const passRate = total > 0 ? ((results.totalPass/total)*100).toFixed(1) : '0.0';

  let md = `# MedFlow Graph — Test Report\n`;
  md += `**Generated:** ${new Date().toLocaleString()}\n\n`;
  md += `## Summary\n\n`;
  md += `| Metric | Value |\n|---|---|\n`;
  md += `| Total Tests | ${total} |\n`;
  md += `| Passed | ${results.totalPass} |\n`;
  md += `| Failed | ${results.totalFail} |\n`;
  md += `| Warned | ${results.totalWarn} |\n`;
  md += `| Pass Rate | ${passRate}% |\n`;
  md += `| Total Time | ${results.totalTime.toFixed(1)}ms |\n\n`;

  if (results.perfResults.length > 0) {
    md += `## Performance Results\n\n`;
    md += `| Test | Time (ms) | Budget (ms) | Status |\n|---|---|---|---|\n`;
    results.perfResults.forEach(p => {
      const s = p.ms <= p.budget ? '✅ PASS' : '❌ FAIL';
      md += `| ${p.label} | ${p.ms.toFixed(3)} | ${p.budget} | ${s} |\n`;
    });
    md += '\n';
  }

  results.suites.forEach(suite => {
    md += `## ${suite.icon} ${suite.name}\n\n`;
    md += `Passed: ${suite.pass} | Failed: ${suite.fail} | Warned: ${suite.warn}\n\n`;
    md += `| # | Test | Status | Time | Notes |\n|---|---|---|---|---|\n`;
    suite.tests.forEach((t,i) => {
      const s = { pass:'✅ PASS', fail:'❌ FAIL', warn:'⚠️ WARN', skip:'⏭ SKIP', run:'⏳ RUN' }[t.status] || t.status;
      const note = t.error ? t.error.replace(/\|/g,'∣') : '';
      md += `| ${i+1} | ${t.name} | ${s} | ${t.time.toFixed(2)}ms | ${note} |\n`;
    });
    md += '\n';
  });

  md += `## Log\n\`\`\`\n${LOG.map(l=>l.msg).join('\n')}\n\`\`\`\n`;

  const blob = new Blob([md], { type:'text/markdown' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `medflow-test-report-${ts}.md`;
  a.click();
  URL.revokeObjectURL(a.href);
}
</script>
</body>
</html>
