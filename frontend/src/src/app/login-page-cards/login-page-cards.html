<div class="card mb-2">
    <div class="card-body d-flex align-items-start p-2 p-md-3">
        <div class="card-icon">
            <i [class]="icon"></i>
        </div>

        <div class="text-block ms-2 ms-md-3">
            <h5 class="card-title mb-1">{{ title }}</h5>
            <p class="card-text mb-0">{{ description }}</p>
        </div>
    </div>
</div>
