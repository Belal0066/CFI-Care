<div class="login-page" style="display:flex; min-height:100vh;">
  <div class="left-side" style="min-width:600px; flex-shrink:0; padding:3rem;">
        <div class="branding d-flex align-items-center" >
            <div class="brand-image mt-5 ms-5">
                <i class="bi bi-activity"></i>
            </div>
            <div class="text-block ms-2">
                <div class=".fs-2 text fw-bold mt-5" style="color: white; font-size: 30px;">MedFlow</div>
                <div class=".fs-5 text mt-0" style="color: rgba(255, 255, 255, 0.84); font-size: 14px;">AI-Powered Collaborative Health Records</div>
            </div>
        </div>

        <div class="advertising mt-5 ms-5">
            <h4 class=" mb-5" style="color: white;">Why healthcare professionals should choose MedFlow</h4>
            <app-login-page-cards 
            icon="bi bi-shield" 
            title="Enterprise Security" 
            description="End-to-end encryption and HIPAA compliance"></app-login-page-cards>
            <app-login-page-cards 
            icon="bi bi-people-fill" 
            title="Seamless Collaboration" 
            description="Real-time sharing between care teams and specialists"></app-login-page-cards>
            <app-login-page-cards 
            icon="bi bi-heart" 
            title="Patient-Centered Care" 
            description="Comprehensive health insights powered by AI analytics"></app-login-page-cards>
        </div>
    </div>

    <div class="right-side">
        <div class="login-container">
            <div class="login-card">
                <div class="login-header">
                    <h2>Welcome Back</h2>
                    <p>Sign in to your account</p>
                </div>
                
                <form class="login-form" id="loginForm" novalidate>
                    <div class="form-group">
                        <div class="input-wrapper">
                            <input type="email" id="email" name="email" required autocomplete="email">
                            <label for="email">Email Address</label>
                            <span class="focus-border"></span>
                        </div>
                        <span class="error-message" id="emailError"></span>
                    </div>

                    <div class="form-group">
                        <div class="input-wrapper password-wrapper">
                            <input type="password" id="password" name="password" required autocomplete="current-password">
                            <label for="password">Password</label>
                            <button type="button" class="password-toggle" id="passwordToggle" aria-label="Toggle password visibility">
                                <span class="eye-icon"></span>
                            </button>
                            <span class="focus-border"></span>
                        </div>
                        <span class="error-message" id="passwordError"></span>
                    </div>

                    <div class="form-options">
                        <label class="remember-wrapper">
                            <input type="checkbox" id="remember" name="remember">
                            <span class="checkbox-label">
                                <span class="checkmark"></span>
                                Remember me
                            </span>
                        </label>
                        <a href="#" class="forgot-password">Forgot password?</a>
                    </div>

                    <button type="submit" class="login-btn btn">
                        <span class="btn-text">Sign In</span>
                        <span class="btn-loader"></span>
                    </button>
                </form>

                <div class="divider">
                    <span>or continue with</span>
                </div>

                <div class="social-login">
                    <button type="button" class="social-btn google-btn">
                        <span class="social-icon google-icon"></span>
                        Google
                    </button>
                    <button type="button" class="social-btn github-btn">
                        <span class="social-icon github-icon"></span>
                        GitHub
                    </button>
                </div>

                <div class="signup-link">
                    <p>Don't have an account? <a href="#">Sign up</a></p>
                </div>

            </div>
        </div>
    </div>
</div>
