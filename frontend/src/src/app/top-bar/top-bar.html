<div class="top-bar">
    <div class="left-section">
        <span class="brand-name">MedFlow</span>
        <span class="divider">|</span>
        <span class="page-title">Patients Dashboard</span>
    </div>

    <div class="right-section">
        <!-- Filter Dropdown -->
        <div class="btn-group">
            <button type="button" class="btn filter-btn dropdown-toggle" data-bs-toggle="dropdown"
                aria-expanded="false">
                <i class="bi bi-funnel-fill flip-icon"></i>
                <span class="filter-text">Filter</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
                <li><button class="dropdown-item" type="button">All Hospitals</button></li>
                <li><button class="dropdown-item" type="button">Populate with hosp1</button></li>
                <li><button class="dropdown-item" type="button">Populate with hosp2</button></li>
            </ul>
        </div>

        <!-- User Info & Logout -->
        <div class="user-section">
            <div class="btn-group">
                <button type="button" class="btn btn-outline-light btn-sm dropdown-toggle" 
                        data-bs-toggle="dropdown" aria-expanded="false">
                    <i class="bi bi-box-arrow-right"></i>
                    <span class="logout-text">Logout</span>
                </button>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li>
                        <button class="dropdown-item" type="button" (click)="logout()">
                            <i class="bi bi-box-arrow-right me-2"></i>
                            Logout (This Device)
                        </button>
                    </li>
                    <li><hr class="dropdown-divider"></li>
                    <li>
                        <button class="dropdown-item text-danger" type="button" (click)="logoutAll()">
                            <i class="bi bi-power me-2"></i>
                            Logout All Devices
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</div>
