<div class="chat-wrapper" [class.open]="showChatbot">

  <!-- ── Header ─────────────────────────────────────────────────────────────── -->
  <div class="chat-header">
    <div class="icon-title-wrapper">
      <div class="header-icon">
        <i class="bi bi-activity"></i>
      </div>
      <div class="chat-title">
        <strong>Clinical AI Assistant</strong>
        <div class="chat-sub">Decision Support &amp; Documentation Aid</div>
      </div>
    </div>
    <button class="chat-close" (click)="onClose()" aria-label="Close assistant">
      <i class="bi bi-caret-right"></i>
    </button>
  </div>

  <!-- ── Chat window ────────────────────────────────────────────────────────── -->
  <div #chatWindow class="chat-window">
    <div *ngFor="let msg of messages"
         class="chat"
         [ngClass]="{
           'incoming-chat': msg.type === 'incoming',
           'outgoing-chat': msg.type === 'outgoing'
         }">

      <!-- Bot avatar -->
      <div class="avatar" *ngIf="msg.type === 'incoming'">
        <i class="bi bi-activity"></i>
      </div>

      <div class="bubble-wrap">
        <!-- Text content -->
        <p *ngIf="msg.text" [class.error]="msg.type === 'error'">{{ msg.text }}</p>

        <!-- Attached files / images -->
        <div class="bubble-files" *ngIf="msg.files && msg.files.length">
          <div class="bubble-file-item" *ngFor="let f of msg.files">
            <img *ngIf="f.type.startsWith('image/')" [src]="f.url" class="chat-image" [alt]="f.name" />
            <a *ngIf="!f.type.startsWith('image/')" [href]="f.url" target="_blank" class="file-pill">
              <i class="bi bi-paperclip"></i>{{ f.name }}
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ── Composer ───────────────────────────────────────────────────────────── -->
  <div class="composer">

    <!-- Attachment preview strip -->
    <div class="attachment-strip" *ngIf="attachments.length > 0">
      <div class="attachment-chip" *ngFor="let att of attachments">
        <ng-container *ngIf="att.type.startsWith('image/')">
          <img [src]="att.url" class="chip-thumb" [alt]="att.name" />
        </ng-container>
        <ng-container *ngIf="!att.type.startsWith('image/')">
          <i class="bi bi-file-earmark chip-icon"></i>
        </ng-container>
        <span class="chip-name">{{ att.name }}</span>
        <button class="chip-remove" (click)="removeAttachment(att.id)" aria-label="Remove attachment">
          <i class="bi bi-x"></i>
        </button>
      </div>
    </div>

    <!-- Textarea row -->
    <div class="composer-row">
      <textarea
        [(ngModel)]="userMessage"
        placeholder="Describe the patient's presentation…"
        rows="1"
        class="composer-textarea"
        (keydown.enter)="$event.preventDefault(); sendMessage()"
      ></textarea>
    </div>

    <!-- Toolbar row -->
    <div class="composer-toolbar">
      <!-- Left: attachment + mic -->
      <div class="toolbar-left">
        <label class="tool-btn" title="Attach files">
          <input #fileInput type="file" (change)="onFileSelected($event)" multiple hidden>
          <i class="bi bi-paperclip"></i>
        </label>

        <button
          type="button"
          class="tool-btn mic-btn"
          [class.mic-active]="isRecording"
          (mousedown)="startRecording()"
          (mouseup)="stopRecording()"
          (mouseleave)="stopRecording()"
          (touchstart)="startRecording()"
          (touchend)="stopRecording()"
          aria-label="Hold to dictate"
          title="Hold to dictate"
        >
          <i class="bi" [ngClass]="isRecording ? 'bi-stop-circle' : 'bi-mic'"></i>
          <span class="mic-label">{{ isRecording ? 'Recording…' : 'Dictate' }}</span>
        </button>
      </div>

      <!-- Right: send -->
      <div class="toolbar-right">
        <span class="hint-text" *ngIf="!isRecording">↵ to send</span>
        <button
          type="button"
          class="send-btn"
          (click)="sendMessage()"
          [disabled]="!userMessage.trim() && attachments.length === 0"
          aria-label="Send message"
        >
          <i class="bi bi-send-fill"></i>
          <span>Send</span>
        </button>
      </div>
    </div>
  </div>
</div>
