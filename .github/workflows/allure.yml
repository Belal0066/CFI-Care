name: Allure Tests

on:
  push:
    paths:
      - "tests/**"
      - ".github/workflows/allure.yml"
  pull_request:
    paths:
      - "tests/**"
      - ".github/workflows/allure.yml"

jobs:
  allure:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/allure
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tests/allure/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Allure CLI
        run: npm ci

      - name: Run pytest
        run: pytest

      - name: Generate Allure report
        run: npm run report

      - name: Upload Allure artifacts
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: |
            tests/allure/allure-report
            tests/allure/allure-results
            tests/allure/allure-history