services:
  vault:
    image: hashicorp/vault:latest
    container_name: vault
    # ports:
    #   - "8200:8200"
    volumes:
      - ./services/hashicorp/config:/vault/config
      - ./services/hashicorp/data:/vault/file
    cap_add:
      - IPC_LOCK
    command: "vault server -config=/vault/config/vault-config.json"