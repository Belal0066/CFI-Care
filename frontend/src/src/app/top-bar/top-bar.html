<div class="top-bar">
  <div class="left-section">
    <span class="brand-name">CFI-Care</span>
    <span class="divider">|</span>
    <span class="page-title">Patients Dashboard</span>
  </div>

  <div class="right-section">
    <button type="button" class="btn nav-btn" (click)="navigateToDashboard()">
      <i class="bi bi-house-door"></i>
      <span class="nav-text">Dashboard</span>
    </button>

    <button type="button" class="btn nav-btn" (click)="navigateToAppointments()">
      <i class="bi bi-calendar-check"></i>
      <span class="nav-text">Appointments</span>
    </button>

    <button type="button" class="btn ai-btn" (click)="navigateToChatGPT()">
      <i class="bi bi-robot"></i>
      <span class="ai-text">AI</span>
    </button>

    <div class="user-section">
      <div class="dropdown">
        <button class="avatar-btn dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
          <i class="bi bi-person-circle"></i>
        </button>
        <ul class="dropdown-menu dropdown-menu-end doctor-menu">
          <li>
            <a class="dropdown-item" routerLink="/doctor-profile">
              <i class="bi bi-person-badge me-2"></i> Doctor Profile
            </a>
          </li>
          <li>
            <button class="dropdown-item" type="button" (click)="navigateToPractitionerProfile()">
              <i class="bi bi-person me-2"></i> My Profile
            </button>
          </li>
          <li>
            <hr class="dropdown-divider">
          </li>
          <li>
            <button class="dropdown-item" type="button" (click)="logout()">
              <i class="bi bi-box-arrow-right me-2"></i> Logout (This Device)
            </button>
          </li>
          <li>
            <button class="dropdown-item text-danger" type="button" (click)="logoutAll()">
              <i class="bi bi-power me-2"></i> Logout All Devices
            </button>
          </li>
        </ul>
      </div>
    </div>
  </div>
</div>
