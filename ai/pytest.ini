[pytest]
markers =
    epic_a: Acceptance tests for Epic A
    epic_b: Acceptance tests for Epic B
    epic_c: Acceptance tests for Epic C
    epic_d: Acceptance tests for Epic D
    epic_e: Acceptance tests for Epic E
    quality_eval: Quality evaluation tests (reconciliation loop + LLM reasoning)
    performance_concurrency: Performance and concurrency stress tests (GPU contention, dead letter, WAL)
    standards: FHIR R5 standards compliance tests (bundle isolation, linting, reference resolution)
    slow: Tests that take longer than 1 second (skip with -m "not slow")
testpaths =
    tests/quality_evaluations
    tests/gateway_acceptance
    tests/gateway_integration
    tests/standards_compliance
