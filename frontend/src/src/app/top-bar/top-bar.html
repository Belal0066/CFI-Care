<div class="top-bar">
    <div class="left-section">
        <span class="brand-name">CFI-Care</span>
        <span class="divider">|</span>
        <span class="page-title">Patients Dashboard</span>
    </div>

    <div class="right-section">
        <!-- Dashboard Button -->
        <button type="button" class="btn nav-btn" (click)="navigateToDashboard()">
            <i class="bi bi-house-door"></i>
            <span class="nav-text">Dashboard</span>
        </button>

        <!-- Appointments Button -->
        <button type="button" class="btn nav-btn" (click)="navigateToAppointments()">
            <i class="bi bi-calendar-check"></i>
            <span class="nav-text">Appointments</span>
        </button>

        <!-- AI Button -->
        <button type="button" class="btn ai-btn" (click)="navigateToChatGPT()">
            <i class="bi bi-robot"></i>
            <span class="ai-text">AI</span>
        </button>

        <!-- User Info & Logout -->
        <div class="user-section">
            <div class="btn-group">
                <button type="button" class="btn btn-outline-light btn-sm dropdown-toggle" data-bs-toggle="dropdown"
                    aria-expanded="false">
                    <i class="bi bi-gear-wide-connected"></i>
                    <span class="logout-text">Settings</span>
                </button>
                <ul class="dropdown-menu dropdown-menu-end">
                                        <li>
                        <button class="dropdown-item" type="button" (click)="openPasswordChange()">
                            <i class="bi bi-key me-2"></i>
                            Change Password
                        </button>
                    </li>
                    <li>
                        <button class="dropdown-item" type="button" (click)="openTOTP()">
                            <i class="bi bi-shield-lock me-2"></i>
                            Configure 2FA (TOTP)
                        </button>
                    </li>

                    <li>
                        <hr class="dropdown-divider">
                    </li>
                                        <li>
                        <button class="dropdown-item" type="button" (click)="logout()">
                            <i class="bi bi-box-arrow-right me-2"></i>
                            Logout (This Device)
                        </button>
                    </li>
                    <li>
                        <button class="dropdown-item text-danger" type="button" (click)="logoutAll()">
                            <i class="bi bi-power me-2"></i>
                            Logout All Devices
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</div>
